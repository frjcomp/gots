version: '3.8'

services:
  gotsl:
    build:
      context: ..
      dockerfile: Dockerfile.e2e
      target: gotsl
    # Start WITH shared secret authentication enabled
    command: ["-s", "--headless", "--control-addr", "0.0.0.0:8081", "--port", "8443", "--interface", "0.0.0.0", "--log-level", "debug"]
    environment:
      GOTSL_FORWARD_BIND_ADDR: "0.0.0.0"
      GOTSL_SOCKS_BIND_ADDR: "0.0.0.0"
      GOTS_SHARED_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Client with CORRECT shared secret (should authenticate successfully)
  gotsr-authenticated:
    build:
      context: ..
      dockerfile: Dockerfile.e2e
      target: gotsr
    depends_on:
      gotsl:
        condition: service_healthy
    command: ["--target", "gotsl:8443", "--retries", "5", "--log-level", "debug"]
    environment:
      GOTS_CLIENT_ID: "authenticated-client"
      GOTS_SHARED_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

  # Client with WRONG shared secret (should fail authentication)
  gotsr-unauthenticated:
    build:
      context: ..
      dockerfile: Dockerfile.e2e
      target: gotsr
    depends_on:
      gotsl:
        condition: service_healthy
    command: ["--target", "gotsl:8443", "--retries", "1", "--log-level", "debug"]
    environment:
      GOTS_CLIENT_ID: "unauthenticated-client"
      GOTS_SHARED_SECRET: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    restart: "no"

  backend:
    image: hashicorp/http-echo:0.2.3
    command: ["-listen=:8080", "-text=response-from-backend"]

  tester:
    build:
      context: ..
      dockerfile: Dockerfile.e2e
      target: tester
    depends_on:
      - gotsl
      - gotsr-authenticated
    environment:
      HEADLESS_ENDPOINT: "http://gotsl:8081"
      JOURNEY_PATH: "integration/journeys/shared-secret.yaml"
    command: ["test", "./integration", "-run", "HeadlessE2E", "-count=1", "-v"]
