name: "Certificate Validation Test"
description: |
  Test TLS certificate fingerprint pinning and verification.
  
  This journey verifies:
  1. Valid certificate allows client connection and command execution
  2. Invalid certificate is rejected during TLS handshake
  3. Certificate validation prevents MITM attacks
  
  Test setup:
  - gotsl: Generates self-signed TLS certificate on startup
  - gotsr-valid-cert: Connects with default TLS validation (works)
  - gotsr-invalid-cert: Connects with invalid fingerprint (rejected)
  
  Expected results:
  - Valid client: Connected, commands execute successfully ✓
  - Invalid client: Connection rejected, no commands possible ✗

default_timeout_ms: 30000

steps:
  - name: "wait for connections to stabilize"
    type: "command"
    command: "sleep 5 && echo 'ready'"
    timeout_ms: 15000
    assertions:
      - type: "contains"
        expected: "ready"
        description: "Wait for TLS handshake attempts to complete"

  - name: "verify only valid-cert client connected"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq -r '.[]' | grep -o 'valid-cert-client' || echo 'not_found'"
    timeout_ms: 15000
    assertions:
      - type: "contains"
        expected: "valid-cert-client"
        description: "Client with valid certificate successfully connected"

  - name: "verify invalid-cert client NOT in list"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq -r '.[]' | grep -o 'invalid-cert-client' || echo 'correctly_rejected'"
    assertions:
      - type: "not_contains"
        expected: "invalid-cert-client"
        description: "Client with invalid certificate fingerprint was rejected and is not in connected clients list"

  - name: "verify exactly one client connected"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq 'length'"
    assertions:
      - type: "equals"
        expected: "1"
        description: "Only the valid certificate client is connected (invalid cert was rejected)"

  - name: "execute command on valid cert client"
    type: "command"
    command: "whoami"
    assertions:
      - type: "contains"
        expected: "root"
        description: "Commands execute successfully on client with valid certificate"

  - name: "verify another command works"
    type: "command"
    command: "echo 'certificate validation passed' && hostname"
    assertions:
      - type: "contains"
        expected: "certificate validation passed"
        description: "Multiple commands work, proving TLS handshake succeeded"

notes: |
  How certificate validation works in gots:
  
  1. LISTENER (gotsl):
     - Generates self-signed TLS certificate on startup
     - Logs: "Certificate generated: SHA256:<fingerprint>"
     - Uses certificate for all TLS connections from clients
  
  2. CLIENT (gotsr) - DEFAULT BEHAVIOR:
     - Connects via TLS to listener
     - Validates certificate chain (will warn for self-signed)
     - Connection succeeds (self-signed is allowed)
     - Commands can be executed
  
  3. CLIENT (gotsr) - WITH FINGERPRINT PINNING:
     - Usage: --cert-fingerprint <sha256_hash>
     - Extracts server certificate during TLS handshake
     - Computes SHA256 fingerprint of certificate
     - Compares against pinned fingerprint
     - Connection rejected if fingerprints don't match
     - This PREVENTS MITM attacks even if TLS chain is valid
  
  4. INVALID CERTIFICATE SCENARIO:
     - Attacker with different certificate tries to intercept
     - Without pinning: Client connects (bad!)
     - With pinning: Client rejects immediately (protected!)
  
  How this test verifies it:
  - gotsr-valid-cert: Connects with valid TLS (successful)
  - gotsr-invalid-cert: Attempts with invalid fingerprint (rejected)
  - Only valid client appears in /clients endpoint
  - Commands only execute on valid client
  - Invalid client cannot execute any commands
  
  For production use:
  1. Extract certificate fingerprint: gotsl logs show "SHA256: ..."
  2. Pin in client: gotsr --cert-fingerprint <hash> --target <host>
  3. Enables secure operation even over untrusted networks
