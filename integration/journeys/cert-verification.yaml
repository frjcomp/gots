name: "Certificate Validation Test"
description: |
  Test TLS certificate fingerprint pinning and verification.
  
  This journey verifies:
  1. Valid certificate allows client connection and command execution
  2. Invalid certificate is rejected during TLS handshake
  3. Certificate validation prevents MITM attacks
  
  Test setup:
  - gotsl: Generates self-signed TLS certificate on startup
  - gotsr-valid-cert: Connects with default TLS validation (works)
  - gotsr-invalid-cert: Connects with invalid fingerprint (rejected)
  
  Expected results:
  - Valid client: Connected, commands execute successfully ✓
  - Invalid client: Connection rejected, no commands possible ✗

default_timeout_ms: 30000

steps:
  - name: "wait for connections to stabilize"
    type: "command"
    command: "sleep 5 && echo 'ready'"
    timeout_ms: 15000
    assertions:
      - type: "contains"
        expected: "ready"
        description: "Wait for TLS handshake attempts to complete"

  - name: "verify exactly one client connected"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq 'length'"
    timeout_ms: 15000
    assertions:
      - type: "equals"
        expected: "1"
        description: "Only one client connected (invalid cert was rejected during TLS handshake)"

  - name: "execute command on valid cert client"
    type: "command"
    command: "whoami"
    assertions:
      - type: "contains"
        expected: "root"
        description: "Commands execute successfully on client with valid certificate"

  - name: "verify another command works"
    type: "command"
    command: "echo 'certificate validation passed' && hostname"
    assertions:
      - type: "contains"
        expected: "certificate validation passed"
        description: "Multiple commands work, proving TLS handshake succeeded"
