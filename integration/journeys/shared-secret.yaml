name: "Shared Secret Authentication Test"
description: |
  Test shared secret handshake and authentication enforcement.
  
  This journey verifies:
  1. Client with valid shared secret connects and authenticates
  2. Client with invalid secret fails authentication
  3. Commands only execute for authenticated clients
  4. Shared secrets prevent unauthorized access
  
  Test setup:
  - gotsl: Started with -s flag (generates random secret)
  - gotsr-valid-secret: Connects with correct secret (authenticated)
  - gotsr-invalid-secret: Connects with wrong secret (rejected at auth)
  
  Expected results:
  - Valid secret client: Connected, authenticated, commands execute ✓
  - Invalid secret client: Connection fails, no commands possible ✗

default_timeout_ms: 30000

steps:
  - name: "wait for connections to stabilize"
    type: "command"
    command: "sleep 5 && echo 'ready'"
    timeout_ms: 15000
    assertions:
      - type: "contains"
        expected: "ready"
        description: "Wait for client connection attempts to complete"

  - name: "verify only authenticated client connected"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq -r '.[]' | grep -o 'authenticated-client' || echo 'not_found'"
    timeout_ms: 15000
    assertions:
      - type: "contains"
        expected: "authenticated-client"
        description: "Client with correct secret successfully connected and authenticated"

  - name: "verify unauthenticated client NOT in list"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq -r '.[]' | grep -o 'unauthenticated-client' || echo 'correctly_rejected'"
    assertions:
      - type: "not_contains"
        expected: "unauthenticated-client"
        description: "Client with wrong secret was rejected and is not in connected clients list"

  - name: "verify exactly one client connected"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq 'length'"
    assertions:
      - type: "equals"
        expected: "1"
        description: "Only the authenticated client is connected (unauthenticated was rejected)"

  - name: "execute command on authenticated client"
    type: "command"
    command: "whoami"
    assertions:
      - type: "contains"
        expected: "root"
        description: "Commands execute successfully on authenticated client"

  - name: "verify another command works"
    type: "command"
    command: "echo 'authentication works' && hostname"
    assertions:
      - type: "contains"
        expected: "authentication works"
        description: "Multiple commands work, proving persistent authentication"

notes: |
  How shared secret authentication works in gots:
  
  1. LISTENER (gotsl):
     - Started with -s flag
     - Generates random 32-byte secret
     - Logs secret in hex format: "Secret (hex): a1b2c3d4..."
     - Waits for clients to authenticate with this secret
     - Rejects any connection that doesn't provide correct secret
  
  2. CLIENT (gotsr) - WITH VALID SECRET:
     - Started with -s <hex_secret>
     - During connection handshake:
       1. Client computes HMAC-SHA256(secret, data)
       2. Sends HMAC to listener
       3. Listener verifies HMAC matches
       4. Connection authenticated, commands enabled
     - Commands can be executed
     - Listener logs: "Client authenticated"
  
  3. CLIENT (gotsr) - WITH INVALID SECRET:
     - Started with -s <wrong_hex_secret>
     - During connection handshake:
       1. Client computes HMAC-SHA256(wrong_secret, data)
       2. Sends incorrect HMAC to listener
       3. Listener verifies: HMAC doesn't match
       4. Connection rejected immediately
     - No commands can be executed
     - Listener logs: "Authentication failed: invalid secret"
  
  4. ATTACK SCENARIO:
     - Without authentication: Any client connects, can execute commands (bad!)
     - With secret: Only client with correct secret can authenticate (protected!)
  
  How this test verifies it:
  - gotsr-valid-secret: Uses correct secret (successful auth)
  - gotsr-invalid-secret: Uses wrong secret (auth rejected)
  - Only authenticated client appears in /clients endpoint
  - Commands only execute on authenticated client
  - Invalid secret client cannot execute any commands
  
  Authentication flow in detail:
  ```
  CLIENT SIDE:                    LISTENER SIDE:
  
  Connect to listener
       |                               Listen for connections
       |-------- TLS handshake --------|
       |                               TLS connection established
       |                               |
  Read secret from config             Wait for auth
       |                               |
  Compute HMAC(secret, challenge) --- |
       |                               |
  Send HMAC ----                       Compute HMAC(stored_secret, challenge)
                \                      |
                 \---> Validate -----> Compare HMACs
                      |                |
                      Match?  -------> Yes: auth success
                      |                |   Enable commands
                      |                |   Log: "Client authenticated"
                      |                No:  auth failed
                      |                |   Log: "Invalid secret"
                      |                |   Close connection
  ```
  
  For production use:
  1. Start listener with -s: gotsl -s --headless --port 9001
  2. Copy secret from output: "Secret (hex): abc123..."
  3. Start client with secret: gotsr -s abc123... --target listener:9001
  4. Only this client can execute commands
  5. Any other client attempting connection will be rejected
  
  Security properties:
  - ✓ Prevents unauthorized access to listener
  - ✓ Works even if listener is on public network
  - ✓ HMAC prevents secret from being sent in clear
  - ✓ Each server instance has different random secret
  - ✓ Secret can be rotated by restarting listener
