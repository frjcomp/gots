name: "Shared Secret Authentication Test"
description: |
  Test shared secret handshake and authentication enforcement.
  
  This journey verifies:
  1. Client with valid shared secret connects and authenticates
  2. Client with invalid secret fails authentication
  3. Commands only execute for authenticated clients
  4. Shared secrets prevent unauthorized access
  
  Test setup:
  - gotsl: Started with -s flag and GOTS_SHARED_SECRET env var
  - gotsr-authenticated: Connects with correct secret (authenticated)
  - gotsr-unauthenticated: Connects with wrong secret (rejected at auth)
  
  Expected results:
  - Valid secret client: Connected, authenticated, commands execute ✓
  - Invalid secret client: Connection fails, no commands possible ✗

default_timeout_ms: 30000

steps:
  - name: "wait for connections to stabilize"
    type: "command"
    command: "sleep 5 && echo 'ready'"
    timeout_ms: 15000
    assertions:
      - type: "contains"
        expected: "ready"
        description: "Wait for client connection attempts to complete"

  - name: "verify exactly one client connected"
    type: "command"
    command: "curl -s http://gotsl:8081/clients | jq 'length'"
    timeout_ms: 15000
    assertions:
      - type: "equals"
        expected: "1"
        description: "Only one client connected (unauthenticated was rejected)"

  - name: "execute command on authenticated client"
    type: "command"
    command: "whoami"
    assertions:
      - type: "contains"
        expected: "root"
        description: "Commands execute successfully on authenticated client"

  - name: "verify another command works"
    type: "command"
    command: "echo 'authentication passed' && hostname"
    assertions:
      - type: "contains"
        expected: "authentication passed"
        description: "Multiple commands work, proving authentication succeeded"
