version: '3.8'

services:
  gotsl:
    build:
      context: ../..
      dockerfile: Dockerfile.e2e
      target: gotsl
    command: ["--headless", "--control-addr", "0.0.0.0:8081", "--port", "8443", "--interface", "0.0.0.0", "--log-level", "debug"]
    environment:
      GOTSL_FORWARD_BIND_ADDR: "0.0.0.0"
      GOTSL_SOCKS_BIND_ADDR: "0.0.0.0"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Client with correct certificate fingerprint
  gotsr-valid-cert:
    build:
      context: ../..
      dockerfile: Dockerfile.e2e
      target: gotsr
    depends_on:
      gotsl:
        condition: service_healthy
    # Note: Extract fingerprint from gotsl logs and provide here
    # Certificate is generated fresh each time, so fingerprint will vary
    # For testing: the actual certificate is stored in the TLS connection
    command: ["--target", "gotsl:8443", "--retries", "5", "--log-level", "debug"]
    environment:
      GOTS_CLIENT_ID: "valid-cert"

  # Client with invalid certificate fingerprint (should fail to connect)
  gotsr-invalid-cert:
    build:
      context: ../..
      dockerfile: Dockerfile.e2e
      target: gotsr
    depends_on:
      gotsl:
        condition: service_healthy
    # Invalid fingerprint - connection should fail
    command: ["--target", "gotsl:8443", "--cert-fingerprint", "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "--retries", "1", "--log-level", "debug"]
    environment:
      GOTS_CLIENT_ID: "invalid-cert"

  backend:
    image: hashicorp/http-echo:0.2.3
    command: ["-listen=:8080", "-text=response-from-backend"]

  tester:
    build:
      context: ../..
      dockerfile: Dockerfile.e2e
      target: tester
    depends_on:
      - gotsl
      - gotsr-valid-cert
    environment:
      HEADLESS_ENDPOINT: "http://gotsl:8081"
      JOURNEY_PATH: "integration/journeys/cert-verification.yaml"
    command: ["test", "./integration", "-run", "HeadlessE2E", "-count=1", "-v"]
